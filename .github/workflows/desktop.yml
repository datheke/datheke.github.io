# Genera los instaladores. Solo a mano (Actions → "App de escritorio" → Run workflow → elegir plataforma), nunca en cada cambio.
name: App de escritorio

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: Qué instalador generar
        type: choice
        options: [windows, android]
        default: windows

permissions:
  contents: read

jobs:
  windows:
    if: inputs.plataforma == 'windows'
    runs-on: windows-latest
    # Para publicar el instalador en la página de descargas (enlace fijo, como el APK).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles nsis 2>&1 | tee build.log || { echo "::error::$(grep -iE -A3 "error|failed|wrong|requires|compileSdk" build.log | grep -v "^\s*$" | tail -60 | sed "s/%/%25/g" | awk '{printf "%s%%0A", $0}')"; exit 1; }
        env:
          VITE_GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: Datheke-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
      # Cada versión es una "release" vX.Y.Z con los dos archivos, con su número en el nombre (Datheke-Windows-X.Y.Z.exe).
      # La app mira la última para avisar que hay versión nueva. Solo desde main (las pruebas de otras ramas no se publican).
      - name: Publicar el instalador
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          F="Datheke-Windows-$V.exe"
          cp src-tauri/target/release/bundle/nsis/*.exe "$F"
          NOTAS="Datheke $V. Celular Android: descarga Datheke-$V.apk. Windows: descarga Datheke-Windows-$V.exe. Se instala encima de la versión anterior sin perder nada."
          gh release create "v$V" --title "Datheke $V" --notes "$NOTAS" --latest --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload "v$V" "$F" --clobber

  android:
    if: inputs.plataforma == 'android'
    runs-on: ubuntu-latest
    # Para publicar el APK en la página de descargas (enlace fijo, se baja directo al celular).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      # El proyecto Android se genera aquí en cada compilación (no se guarda en el repositorio).
      - run: npx tauri android init --ci
      # La app es siempre clara: hora, batería y señal en oscuro también con el celular en modo oscuro (si no, blanco sobre blanco).
      - run: |
          f=$(find src-tauri/gen/android -name MainActivity.kt)
          sed -i 's/enableEdgeToEdge()/enableEdgeToEdge(androidx.activity.SystemBarStyle.light(0, 0), androidx.activity.SystemBarStyle.light(0, 0x801b1b1b.toInt()))/' "$f"
          grep -q SystemBarStyle "$f"
      # Micrófono para "Dictar a Gemini" (la app lo pide la primera vez que se usa).
      - run: |
          m=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' "$m"
          grep -q RECORD_AUDIO "$m" || { echo "No se pudo agregar el permiso del micrófono"; cat "$m"; exit 1; }
      # Recordatorios a la hora exacta (si no, Android puede atrasarlos varios minutos).
      - run: |
          m=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />#' "$m"
          grep -q USE_EXACT_ALARM "$m" || { echo "No se pudo agregar el permiso de alarmas exactas"; exit 1; }
      # Arreglos a plugins de Android (ver el archivo): compileSdk del menú de compartir y botones de la notificación.
      - run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          python3 scripts/patch-android.py
      # Abrir con Datheke: tocar un .datheke en WhatsApp, Descargas o un correo lo abre en la app.
      - run: python3 scripts/patch-app.py
      - run: npx tauri icon public/icon.png
      - shell: bash
        run: |
          set -o pipefail
          npx tauri android build --apk --target aarch64 2>&1 | tee build.log || { echo "::error::$(grep -iE -A3 "error|failed|wrong|requires|compileSdk" build.log | grep -v "^\s*$" | tail -60 | sed "s/%/%25/g" | awk '{printf "%s%%0A", $0}')"; exit 1; }
        env:
          VITE_GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
      - name: Firmar el APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/datheke.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/datheke.jks" --ks-pass env:KS_PASS --out Datheke.apk "$RUNNER_TEMP/aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Datheke-Android
          path: Datheke.apk
      - name: Publicar el APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          F="Datheke-$V.apk"
          cp Datheke.apk "$F"
          NOTAS="Datheke $V. Celular Android: descarga Datheke-$V.apk. Windows: descarga Datheke-Windows-$V.exe. Se instala encima de la versión anterior sin perder nada."
          gh release create "v$V" --title "Datheke $V" --notes "$NOTAS" --latest --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload "v$V" "$F" --clobber
