# Genera los instaladores. Solo a mano (Actions → "App de escritorio" → Run workflow → elegir plataforma), nunca en cada cambio.
name: App de escritorio

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: Qué instalador generar
        type: choice
        options: [windows, android]
        default: windows

permissions:
  contents: read

jobs:
  windows:
    if: inputs.plataforma == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles nsis
        env:
          VITE_GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: Datheke-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    if: inputs.plataforma == 'android'
    runs-on: ubuntu-latest
    # Para publicar el APK en la página de descargas (enlace fijo, se baja directo al celular).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      # El proyecto Android se genera aquí en cada compilación (no se guarda en el repositorio).
      - run: npx tauri android init --ci
      # La app es siempre clara: hora, batería y señal en oscuro también con el celular en modo oscuro (si no, blanco sobre blanco).
      - run: |
          f=$(find src-tauri/gen/android -name MainActivity.kt)
          sed -i 's/enableEdgeToEdge()/enableEdgeToEdge(androidx.activity.SystemBarStyle.light(0, 0), androidx.activity.SystemBarStyle.light(0, 0x801b1b1b.toInt()))/' "$f"
          grep -q SystemBarStyle "$f"
      - run: npx tauri icon public/icon.svg
      - run: npx tauri android build --apk --target aarch64
        env:
          VITE_GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
      - name: Firmar el APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/datheke.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/datheke.jks" --ks-pass env:KS_PASS --out Datheke.apk "$RUNNER_TEMP/aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Datheke-Android
          path: Datheke.apk
      # Enlace fijo para el celular: github.com/datheke/datheke.github.io/releases/download/android/Datheke.apk
      - name: Publicar el APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NOTAS="Datheke $V para Android. Toca Datheke.apk para descargarlo e instálalo encima del anterior."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android Datheke.apk --clobber
            gh release edit android --title "Datheke para Android ($V)" --notes "$NOTAS"
          else
            gh release create android Datheke.apk --title "Datheke para Android ($V)" --notes "$NOTAS" --latest
          fi
