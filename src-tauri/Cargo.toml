[package]
name = "datheke"
version = "0.1.0"
description = "Datheke: notas en tu propio Google Drive"
edition = "2024"
rust-version = "1.90"

[lib]
name = "datheke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5" }
tauri-plugin-opener = "2.7.2"
tauri-plugin-oauth = "2.1.0"
