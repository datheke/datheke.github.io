[package]
name = "datheke"
version = "0.1.0"
description = "Datheke: notas en tu propio Google Drive"
edition = "2024"
rust-version = "1.90"

[lib]
name = "datheke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-oauth = "2.1.0"
tauri-plugin-fs = "2.7.1"
# Avisos de los recordatorios (Android: programados en el teléfono; Windows: mientras Datheke está en segundo plano).
tauri-plugin-notification = "2"

# Huella para abrir las notas con clave (solo en el celular).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"
# Enviar copia: el menú de compartir del celular (WhatsApp, correo…). En Windows la copia queda en Documentos/Datheke/Enviadas.
tauri-plugin-sharekit = "=0.4.0-rc.7"

# Windows: arrancar con la PC (en segundo plano, para los recordatorios) y una sola ventana de Datheke a la vez.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
