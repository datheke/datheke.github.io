[package]
name = "datheke"
version = "0.1.0"
description = "Datheke: notas en tu propio Google Drive"
edition = "2024"
rust-version = "1.90"

[lib]
name = "datheke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5" }
tauri-plugin-opener = "2.7.2"
tauri-plugin-oauth = "2.1.0"
tauri-plugin-fs = "2.7.1"

# Huella para abrir las notas con clave (solo en el celular).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"
