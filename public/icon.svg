<svg xmlns="http://www.w3.org/2000/svg" viewBox="42 6 440 440">
  <defs>
    <linearGradient id="cinta" x1="150" y1="110" x2="370" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2e83a"/>
      <stop offset=".38" stop-color="#b3db2f"/>
      <stop offset=".62" stop-color="#7cc944"/>
      <stop offset=".82" stop-color="#2bb3b1"/>
