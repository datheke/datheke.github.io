    <linearGradient id="hueco" x1="330" y1="180" x2="260" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f9fb4" stop-opacity="0"/><stop offset=".5" stop-color="#1c84ab"/><stop offset="1" stop-color="#175f96"/>
    </linearGradient>
    <radialGradient id="sombra" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
